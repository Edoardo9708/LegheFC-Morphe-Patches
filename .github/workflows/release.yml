name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Bundle the pinned upstream diagnostic library only when the F5 patch
      # is present. Morphe will not download executable code on the phone.
      - name: Prepare Prezzi Benzina Frida Gadget (ARM64, diagnostic)
        if: hashFiles('patches/src/main/kotlin/lab/prezzibenzina/patches/SignatureTracePatch.kt') != ''
        run: |
          set -euo pipefail
          directory=patches/src/main/resources/pbdiag
          mkdir -p "$directory"
          curl --fail --location --retry 3 --silent --show-error \
            -o /tmp/pb-frida-gadget.so.xz \
            https://github.com/frida/frida/releases/download/17.24.3/frida-gadget-17.24.3-android-arm64.so.xz
          echo "c5b86db3569d06769da2b29a80c7a275422c3bb292bd7881ea30566fd2161948  /tmp/pb-frida-gadget.so.xz" | sha256sum --check
          xz --test /tmp/pb-frida-gadget.so.xz
          xz --decompress --stdout /tmp/pb-frida-gadget.so.xz > "$directory/libpbfridagadget.so"
          test "$(stat -c '%s' "$directory/libpbfridagadget.so")" -gt 1000000
          file "$directory/libpbfridagadget.so"
          sha256sum /tmp/pb-frida-gadget.so.xz "$directory/libpbfridagadget.so"
          # Frida 17 no longer embeds the Java bridge; bundle it into the
          # standalone script consumed by Gadget on the phone (no PC needed).
          npm install --no-save --no-package-lock \
            frida-compile@19.1.0 frida-java-bridge@7.0.13
          ./node_modules/.bin/frida-compile \
            "$directory/frida-signature-agent.js" \
            -o "$directory/libpbfridagadget.script.so"
          test "$(stat -c '%s' "$directory/libpbfridagadget.script.so")" -gt 1000
          grep -q PB-FRIDA-20261030-F5 "$directory/libpbfridagadget.script.so"
          # The optional F6 patch is independent of F5: its compiled agent
          # is bundled under another resource name, selected when patching.
          ./node_modules/.bin/frida-compile \
            "$directory/frida-custom-signature-agent.js" \
            -o "$directory/libpbcustom.script.so"
          test "$(stat -c '%s' "$directory/libpbcustom.script.so")" -gt 1000
          grep -q PB-FRIDA-20261030-F6 "$directory/libpbcustom.script.so"
          # F7 is core-only: no Frida Java bridge and no Java hooks.
          # Keep it a separate compiled resource; do not alter F5/F6.
          ./node_modules/.bin/frida-compile \
            "$directory/frida-gadget-only-agent.js" \
            -o "$directory/libpbgadgetonly.script.so"
          test "$(stat -c '%s' "$directory/libpbgadgetonly.script.so")" -gt 500
          grep -q PB-FRIDA-20261030-F7 "$directory/libpbgadgetonly.script.so"



      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
