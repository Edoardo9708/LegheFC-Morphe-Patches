name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Bundle the pinned upstream diagnostic library only when the F1 patch
      # is present. Morphe will not download executable code on the phone.
      - name: Prepare Prezzi Benzina Frida Gadget (ARM64, diagnostic)
        if: hashFiles('patches/src/main/kotlin/lab/prezzibenzina/patches/SignatureTracePatch.kt') != ''
        run: |
          set -euo pipefail
          directory=patches/src/main/resources/pbdiag
          mkdir -p "$directory"
          curl --fail --location --retry 3 --silent --show-error \
            -o /tmp/pb-frida-gadget.so.xz \
            https://github.com/frida/frida/releases/download/16.7.19/frida-gadget-16.7.19-android-arm64.so.xz
          xz --test /tmp/pb-frida-gadget.so.xz
          xz --decompress --stdout /tmp/pb-frida-gadget.so.xz > "$directory/libpbfridagadget.so"
          test "$(stat -c '%s' "$directory/libpbfridagadget.so")" -gt 1000000
          file "$directory/libpbfridagadget.so"
          sha256sum /tmp/pb-frida-gadget.so.xz "$directory/libpbfridagadget.so"

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
