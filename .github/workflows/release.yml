name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # One-time recovery of dev.12: the previous fallback uploaded a
      # pre-publication archive which lacked the Dex payload in patches.jar.
      # Restore the same final bundle that Gradle publish would normally create.
      - name: Rebuild corrupted dev.12 asset
        if: github.ref == 'refs/heads/dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v1.2.0-dev.12"
          bundle="patches/build/libs/patches-1.2.0-dev.12.mpp"
          # The branch contains the same patch sources as the dev.12 tag.
          ./gradlew publish -q
          test -s "$bundle" || { echo "::error::No final bundle found"; exit 1; }
          python3 - "$bundle" <<'PY'
          import io
          import sys
          import zipfile

          bundle = sys.argv[1]
          found = []
          with zipfile.ZipFile(bundle) as archive:
              for entry in archive.namelist():
                  if entry.endswith(".dex"):
                      found.append(entry)
                  elif entry.endswith(".jar"):
                      try:
                          with zipfile.ZipFile(io.BytesIO(archive.read(entry))) as nested:
                              for name in nested.namelist():
                                  if name.endswith(".dex"):
                                      found.append(f"{entry}!/{name}")
                      except zipfile.BadZipFile:
                          pass
          if not found:
              raise SystemExit(f"INVALID Morphe bundle: no DEX files in {bundle}")
          print(f"Validated {bundle}: DEX files found: {found}")
          PY

          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')
          old_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[] | select(.name == "patches-1.2.0-dev.12.mpp") | .id')
          test -n "$old_id" || { echo "::error::Broken dev.12 asset not found"; exit 1; }
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f target_commitish=dev >/dev/null
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/dash-patch+xml" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$bundle" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=patches-1.2.0-dev.12.mpp" \
            | jq -e '.state == "uploaded" and .content_type == "application/dash-patch+xml" and (.size > 0)'
          echo "Restored dev.12 with a complete DEX-bearing bundle."

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        # On dev only, a guarded recovery below can publish a successfully
        # built bundle if semantic-release fails on git-notes synchronization.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub may reject refs/notes (missing necessary objects) AFTER
      # the release commit/tag but BEFORE Gradle publish creates the final .mpp.
      # Recover only on dev, only with the expected, nonempty bundle,
      # and only when the tag was actually pushed by semantic-release.
      - name: Recover prepared dev release
        id: recover
        if: steps.release.outcome == 'failure' && github.ref == 'refs/heads/dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' gradle.properties | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]] || { echo "::error::Invalid prepared dev version: $version"; exit 1; }
          tag="v$version"
          bundle="patches/build/libs/patches-$version.mpp"
          # The bundle is built in the publish phase below, not in prepare.
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || { echo "::error::Release tag $tag was not pushed"; exit 1; }
          # Normal semantic-release calls Gradle publish AFTER prepare.
          # This is essential: the mpp from prepare lacks Dex payloads.
          ./gradlew publish -q
          test -s "$bundle" || { echo "::error::Final published bundle is missing"; exit 1; }
          python3 - "$bundle" <<'PY'
          import io
          import sys
          import zipfile

          bundle = sys.argv[1]
          found = []
          with zipfile.ZipFile(bundle) as archive:
              for entry in archive.namelist():
                  if entry.endswith(".dex"):
                      found.append(entry)
                  elif entry.endswith(".jar"):
                      try:
                          with zipfile.ZipFile(io.BytesIO(archive.read(entry))) as nested:
                              for name in nested.namelist():
                                  if name.endswith(".dex"):
                                      found.append(f"{entry}!/{name}")
                      except zipfile.BadZipFile:
                          pass
          if not found:
              raise SystemExit(f"INVALID Morphe bundle: no DEX files in {bundle}")
          print(f"Validated {bundle}: DEX files found: {found}")
          PY

          # Upload with Morphe's media type, not gh CLI's guessed Musepack type.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --target dev --prerelease \
              --title "$tag" \
              --notes "Recovered publication of the prepared $tag bundle after semantic-release failed to push Git notes."
          fi
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')
          old_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq ".[] | select(.name == \"patches-$version.mpp\") | .id")
          if [[ -n "$old_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"
          fi
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/dash-patch+xml" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$bundle" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=patches-$version.mpp" \
            | jq -e '.state == "uploaded" and .content_type == "application/dash-patch+xml" and (.size > 0)'
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fail if release could not be published
        if: steps.release.outcome == 'failure' && steps.recover.outputs.published != 'true'
        run: |
          echo "::error::Release failed and no verified bundle was published."
          exit 1

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true' || steps.recover.outputs.published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag || steps.recover.outputs.tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Verify compilation on non-release commits; recovery already
      # requires an existing compiled bundle.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true' && steps.recover.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
