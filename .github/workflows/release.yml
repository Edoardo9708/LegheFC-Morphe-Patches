name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Repair the dev.12 release accidentally uploaded by gh CLI with
      # audio/x-musepack instead of Morphe's patch-bundle media type.
      # Idempotent: a correctly typed asset is never replaced.
      - name: Repair dev.12 published asset metadata
        if: github.ref == 'refs/heads/dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v1.2.0-dev.12"
          asset="patches-1.2.0-dev.12.mpp"
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')
          existing_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq ".[] | select(.name == \"$asset\") | .id")
          test -n "$existing_id" || { echo "::error::Expected dev.12 asset missing"; exit 1; }
          mime=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id" --jq '.content_type')
          if [[ "$mime" == "application/dash-patch+xml" ]]; then
            echo "Existing bundle already has the expected Morphe media type."
            exit 0
          fi
          dir=$(mktemp -d)
          gh release download "$tag" --pattern "$asset" --dir "$dir"
          test -s "$dir/$asset"
          unzip -tq "$dir/$asset" >/dev/null
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f target_commitish=dev >/dev/null
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing_id"
          upload_url="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset"
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/dash-patch+xml" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$dir/$asset" "$upload_url" | jq -e '.state == "uploaded" and .content_type == "application/dash-patch+xml" and (.size > 0)'
          echo "Repaired $tag patch bundle media type."

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        # On dev only, a guarded recovery below can publish a successfully
        # built bundle if semantic-release fails on git-notes synchronization.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub may reject refs/notes (missing necessary objects) AFTER
      # the release commit/tag and Gradle .mpp have already been prepared.
      # Recover only on dev, only with the expected, nonempty bundle,
      # and only when the tag was actually pushed by semantic-release.
      - name: Recover prepared dev release
        id: recover
        if: steps.release.outcome == 'failure' && github.ref == 'refs/heads/dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*([^[:space:]]+).*$/\1/p' gradle.properties | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]] || { echo "::error::Invalid prepared dev version: $version"; exit 1; }
          tag="v$version"
          bundle="patches/build/libs/patches-$version.mpp"
          test -s "$bundle" || { echo "::error::No compiled bundle for $tag"; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || { echo "::error::Release tag $tag was not pushed"; exit 1; }
          # Publish with the same release metadata and MIME type as
          # @semantic-release/github. gh release upload otherwise guesses
          # audio/x-musepack for .mpp and Morphe cannot recognize it.
          unzip -tq "$bundle" >/dev/null
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --target dev --prerelease \
              --title "$tag" \
              --notes "Recovered publication of the prepared $tag bundle after semantic-release failed to push Git notes."
          fi
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')
          old_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq ".[] | select(.name == \"patches-$version.mpp\") | .id")
          if [[ -n "$old_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"
          fi
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/dash-patch+xml" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$bundle" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=patches-$version.mpp" \
            | jq -e '.state == "uploaded" and .content_type == "application/dash-patch+xml" and (.size > 0)'
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fail if release could not be published
        if: steps.release.outcome == 'failure' && steps.recover.outputs.published != 'true'
        run: |
          echo "::error::Release failed and no verified bundle was published."
          exit 1

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true' || steps.recover.outputs.published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag || steps.recover.outputs.tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Verify compilation on non-release commits; recovery already
      # requires an existing compiled bundle.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true' && steps.recover.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
